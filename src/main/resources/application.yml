server:
  port: 8080

spring:
  application:
    name: automated-customer-support-desk
  datasource:
    url: jdbc:h2:mem:supportdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:user}
    password: ${SMTP_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Support Desk Application Configuration
app:
  jwt:
    secret: "AutomatedCustomerSupportDeskSuperSecretKey2026SecureWithHighEntropy1234567890!"
    expiration-ms: 86400000 # 24 hours
  ai:
    autonomy-threshold: 0.75 # Minimum confidence score for pure automated resolution
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: support@supportdesk.io
    imap:
      enabled: false
      poll-interval-ms: 60000

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
