services:
  # Spring Boot Microservice Application
  support-desk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-desk-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=support-desk-db
      - DB_PORT=5432
      - DB_NAME=supportdesk
      - DB_USER=supportuser
      - DB_PASSWORD=supportpass
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - MAIL_ENABLED=true
    depends_on:
      support-desk-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - supportdesk-network
    restart: unless-stopped

  # PostgreSQL Relational Database
  support-desk-db:
    image: postgres:16-alpine
    container_name: support-desk-db
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportuser
      POSTGRES_PASSWORD: supportpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportuser -d supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supportdesk-network

  # MailHog SMTP Server & Visual Mailbox Inspector
  mailhog:
    image: mailhog/mailhog:latest
    container_name: support-desk-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port for inspecting emails
    networks:
      - supportdesk-network

networks:
  supportdesk-network:
    driver: bridge

volumes:
  postgres-data:
